[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "wright-telemetry"
version = "0.1.0"
description = "Collects miner telemetry and sends it to the Wright Fan dashboard"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "certifi",
    "cryptography>=41.0.0",
    "websockets>=12.0",
    "openpyxl>=3.1.0",
    "rich>=13.0",
    "questionary>=2.0",
    "pyfiglet>=1.0.2",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.11.0",
]
dev = [
    "pyinstaller>=6.0",
    "dmgbuild>=1.6",
    "pytest>=7.0",
    "responses>=0.25.0",
    "psutil>=5.9.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "error::ResourceWarning",
]

[project.scripts]
wright-telemetry = "wright_telemetry.__main__:main"

[tool.setuptools.packages.find]
include = ["wright_telemetry*"]
